<style>

ink);padding:30px;max-width:940px;width:90vw;max-height:85dvh}dialog::backdrop{background:#000a}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.dialog-head h2{font-size:28px;margin:0}.dialog-head button{background:transparent;border:1px solid var(--line);padding:7px 14px}.toc{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}.toc button{text-align:left;border:0;background:transparent;border-bottom:1px solid var(--line);padding:11px 6px;color:var(--ink);font-size:17px}.toc button[aria-current=true]{background:#deead8;font-weight:700}#notes-panel{font-size:23px;line-height:1.6;white-space:pre-line}#timer{font-variant-numeric:tabular-nums;font-size:25px;font-weight:700;min-width:80px;display:inline-block}.timer-line{display:flex;align-items:center;gap:14px}.timer-line button{background:transparent;border:1px solid var(--green);color:var(--green);padding:8px 16px;font-size:20px}@keyframes enter{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(max-width:680px){.nav{gap:6px;padding:8px}.nav button{font-size:14px;padding:8px}.nav .spacer{display:none}.nav .counter{min-width:52px}.toc{grid-template-columns:1fr}}@media print{@page{size:1280px 720px;margin:0}body{background:white}#viewport{height:auto;display:block;overflow:visible}.deck{width:1280px;height:auto;transform:none}.slide,.slide.active{position:relative;display:flex;width:1280px;height:720px;page-break-after:always;break-after:page;animation:none;print-color-adjust:exact;-webkit-print-color-adjust:exact}.slide:last-child{break-after:auto}.nav,.progress,dialog,.reveal,.timer-line button{display:none!important}.answer{display:block}.feedback:empty{display:none}.number{color:inherit}}

<script>
'use strict';
// Tình huống, tên nhân vật và dữ liệu giấy phép trong bài tập là giả định.
const sources={conduct:'https://mic.mediacdn.vn/Upload_Moi/VanBan/874qd.PDF',copyright:'https://congbaocdn.chinhphu.vn/180507251028987904/2026/4/10/469197-1775632354_v1_1775783230_signed.pdf',amendment:'https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/01/luat131-2025.pdf',cc:'https://creativecommons.org/share-your-work/cclicenses/',by:'https://creativecommons.org/licenses/by/4.0/'};
const reveal=(html,label='Mở gợi ý')=>'<button class="reveal" data-reveal aria-expanded="false">'+label+'</button><div class="answer">'+html+'</div>';
const row=(n,title,text)=>'<div class="row"><b>'+n+'</b><div><p><strong>'+title+'</strong></p>'+(text?'<p class="small">'+text+'</p>':'')+'</div></div>';
const slides=[
{title:'Ứng xử trên môi trường số',part:'Bài 11 · Tin học 10 · Kết nối tri thức',theme:'dark',body:'<h1>Ứng xử trên<br>môi trường số</h1><p class="cover-sub">Nghĩa vụ tôn trọng bản quyền</p><p class="lead accent" style="margin-top:36px">Mỗi lần đăng, chia sẻ, sử dụng —<br>em đều có một lựa chọn.</p><div class="cover-end"><span>THPT Na Rì</span><span>Tôn trọng con người · Tôn trọng sáng tạo</span></div>',notes:'Thời lượng gợi ý: 45 phút. Khởi động 5 phút; ứng xử số 13 phút; bản quyền 14 phút; luyện tập 8 phút; vận dụng và kết thúc 5 phút. Điều chỉnh theo lớp.\nCác tình huống đều giả định; không yêu cầu học sinh kể chuyện riêng tư.\nĐiều khiển: ←/→ chuyển trang; Space/↓ mở gợi ý rồi chuyển trang; M mục lục; N gợi ý dạy; F toàn màn hình; Home/End đầu/cuối. In bằng trình duyệt để có bản phát tay.'},
{title:'Một tin nhắn trong nhóm lớp',part:'Khởi động · 2 phút',body:'<div class="split wide"><div class="chat"><p class="sender">NHÓM LỚP 10A · Tình huống giả định</p><div class="message"><p>Minh: “Ảnh này của An buồn cười quá!”</p></div><div class="message"><p>Hà: “Đăng lên trang lớp đi, chắc nhiều lượt thích.”</p></div><div class="message"><p>An: “Mình không muốn mọi người đăng ảnh này.”</p></div></div><div><p class="lead">Em là người tiếp theo đọc được tin nhắn.</p><p class="prompt" style="margin-top:24px">Em sẽ viết gì trong một câu?</p><p class="small" style="margin-top:18px">Suy nghĩ cá nhân → trao đổi với bạn bên cạnh.</p></div></div>'+reveal('<div class="callout">“An không đồng ý rồi, mình đừng đăng. Nếu ảnh đã lên mạng, hãy gỡ và xin lỗi bạn.”</div>','Xem một cách phản hồi'),notes:'Cho lớp 20 giây suy nghĩ, 40 giây trao đổi cặp đôi, mời 2 học sinh trả lời. Hỏi thêm: Nếu em là An, em muốn bạn bè làm gì?\nMục đích: nhận ra một hành vi trên mạng tác động tới con người thật.'},
{title:'Hôm nay em sẽ làm được gì?',part:'Mục tiêu bài học',body:'<div class="rows">'+row('01','Nhận diện hành vi chưa phù hợp','Giải thích bằng đạo đức, văn hoá và pháp luật.')+row('02','Chọn cách phản hồi có trách nhiệm','Kiểm chứng tin, bảo vệ riêng tư, hỗ trợ người bị bắt nạt.')+row('03','Sử dụng sản phẩm số đúng quyền','Phân biệt quyền tác giả và giấy phép; biết kiểm tra và ghi nguồn.')+'</div><p class="bottom">Cuối giờ: xử lí một tình huống và đề xuất một cách làm cụ thể.</p>',notes:'Đọc nhanh ba mục tiêu: nhận diện, lựa chọn, thực hiện. Không yêu cầu học thuộc tên và năm của nhiều văn bản. Bám ba phần Bài 11: đạo đức/pháp luật/văn hoá; quy định khi chia sẻ; bản quyền.'},
{title:'Vì sao một cú nhấp có thể gây hại?',part:'01 · Ứng xử trong môi trường số',body:'<p class="statement">Nội dung có thể lan xa hơn<br><span class="accent">ý định ban đầu của em.</span></p><div class="three"><div><h3>Dễ sao chép</h3><p>Một ảnh có thể được chụp lại và gửi sang nhóm khác.</p></div><div><h3>Khó thu hồi</h3><p>Xoá bài gốc chưa chắc xoá được các bản đã lưu.</p></div><div><h3>Thiếu ngữ cảnh</h3><p>Một câu đùa có thể trở thành lời xúc phạm.</p></div></div><p class="bottom">Tài khoản ẩn danh không loại bỏ trách nhiệm về hành vi.</p>',notes:'2 phút. Liên hệ ảnh của An. Hỏi: An có kiểm soát được mọi bản sao sau khi bạn đăng không? Tránh khẳng định mọi nội dung đều tồn tại vĩnh viễn hoặc mọi tài khoản đều chắc chắn truy ra được.'},
{title:'Ba góc nhìn về cùng một hành vi',part:'01 · Đạo đức, văn hoá và pháp luật',body:'<div class="three"><div><h3>Đạo đức</h3><p>Hành vi có trung thực, tôn trọng và gây tổn thương ai không?</p></div><div><h3>Văn hoá</h3><p>Cách nói và cách làm có lịch sự, phù hợp với hoàn cảnh không?</p></div><div><h3>Pháp luật</h3><p>Hành vi có xâm phạm quyền, lợi ích được pháp luật bảo vệ không?</p></div></div><p class="quote">Một hành vi có thể đồng thời liên quan đến cả ba góc nhìn.</p>'+reveal('<p class="callout">Đăng ảnh để chế giễu bạn: thiếu tôn trọng, ứng xử thiếu văn hoá và có thể xâm phạm quyền của bạn.</p>','Phân tích ảnh của An'),notes:'2 phút. Ba góc nhìn có thể giao nhau. Không suy diễn mọi lời nói thiếu lịch sự đều tự động cấu thành vi phạm pháp luật.\nTham khảo: '+sources.conduct},
{title:'Nhận diện những hành vi cần tránh',part:'01 · Nhận diện',body:'<div class="rows">'+row('01','Đăng hoặc chia sẻ tin sai sự thật','Ví dụ: chuyển tiếp thông báo nghỉ học chưa được xác nhận.')+row('02','Tiết lộ thông tin riêng tư','Ví dụ: công khai số điện thoại, ảnh hoặc tin nhắn của bạn khi chưa được phép.')+row('03','Xúc phạm, bắt nạt, phân biệt đối xử','Ví dụ: lập nhóm tẩy chay hoặc liên tục chế giễu một bạn.')+row('04','Phát tán tin rác, nội dung có hại, vi phạm bản quyền','Ví dụ: gửi quảng cáo hàng loạt hoặc chia sẻ bản sao phần mềm trái phép.')+'</div>',notes:'1 phút. Tìm dấu hiệu nhận diện; phần bản quyền sẽ phân tích ở nửa sau. Ví dụ về riêng tư là nguyên tắc ứng xử an toàn; xác định vi phạm pháp luật cần xem hoàn cảnh cụ thể.'},
{title:'Trước khi bấm “Chia sẻ”',part:'02 · Trách nhiệm khi đưa tin',body:'<p class="lead">Nhóm lớp nhận được ảnh chụp: “Ngày mai toàn trường nghỉ học”. Không có đường dẫn hay người xác nhận.</p><div class="rows">'+row('1','Kiểm tra nguồn','Ai phát hành? Có phải kênh chính thức của nhà trường không?')+row('2','Kiểm tra thời điểm và ngữ cảnh','Thông báo có mới, đầy đủ và áp dụng cho trường mình không?')+row('3','Đối chiếu trước khi chuyển tiếp','Xem kênh chính thức hoặc hỏi giáo viên; chưa xác nhận thì chưa chia sẻ.')+'</div><p class="bottom">Nhiều người chia sẻ không phải là bằng chứng thông tin đúng.</p>',notes:'2 phút. Hỏi: ảnh có logo trường đã đủ tin chưa? Chốt: ảnh có thể cũ hoặc bị chỉnh sửa, cần kiểm tra kênh phát hành gốc.\nNguồn: '+sources.conduct},
{title:'Góp ý mà không công kích',part:'02 · Thực hành lời nói',body:'<p class="scenario-label">TRONG NHÓM LÀM BÀI THUYẾT TRÌNH</p><p class="quote">“Cậu làm kiểu gì mà dở thế! Đừng tham gia nữa.”</p><p class="lead">Hãy viết lại để góp ý vào <strong>sản phẩm</strong><br>và đề nghị một <strong>hành động sửa</strong>.</p>'+reveal('<div class="callout">“Slide này hơi nhiều chữ, nhóm mình chọn ba ý chính và thêm một ví dụ nhé. Cậu cùng mình sửa được không?”</div>','Xem cách diễn đạt')+'<p class="bottom">Nêu vấn đề cụ thể → nói lịch sự → đề xuất cách cải thiện.</p>',notes:'1 phút. Mời 1–2 câu thay thế. Chấp nhận nhiều cách diễn đạt nếu không hạ thấp người khác và có đề nghị cụ thể. Không bắt học sinh lặp nguyên văn đáp án.'},
{title:'Khi thấy bạn bị bắt nạt trên mạng',part:'02 · Hành động hỗ trợ',body:'<div class="split"><div><p class="statement">Đừng làm nội dung<br><span class="accent">lan rộng thêm.</span></p><p class="small" style="margin-top:24px">Không thả cảm xúc cổ vũ, không gửi lại ảnh xúc phạm để “hỏi cho rõ”.</p></div><div class="rows">'+row('1','Dừng tương tác gây hại','Nhắn riêng để động viên người bị nhắm tới.')+row('2','Lưu bằng chứng cần thiết','Giữ tin nhắn, đường dẫn; không phát tán công khai.')+row('3','Báo cáo và tìm hỗ trợ','Báo nền tảng, giáo viên hoặc người lớn đáng tin cậy.')+'</div></div>',notes:'2 phút. Phân biệt lưu bằng chứng để nhờ hỗ trợ với chia sẻ lại gây tổn thương. Không khuyến khích đối đầu một mình với người đe doạ. Nếu học sinh kể chuyện thật, tiếp nhận riêng và theo quy trình hỗ trợ của trường.'},
{title:'Chia sẻ cũng là một hành động',part:'02 · Đạo đức và trách nhiệm pháp lí',theme:'dark',body:'<p class="statement">“Em chỉ chia sẻ lại”<br><span class="accent">không xoá trách nhiệm.</span></p><div class="split"><p class="lead">Nội dung sai sự thật, xúc phạm hoặc xâm phạm quyền của người khác có thể gây thiệt hại thực tế.</p><div class="rule"><p>Tuỳ hành vi, mức độ và quy định áp dụng, người vi phạm có thể phải gỡ nội dung, cải chính, bồi thường hoặc chịu chế tài.</p></div></div><p class="bottom">Không quy kết mức phạt chỉ từ một ảnh chụp hay một câu kể.</p>',notes:'1 phút. Hiểu trách nhiệm, không học thuộc tiền phạt. Trách nhiệm pháp lí phụ thuộc nội dung, lỗi, chủ thể, tuổi và hậu quả, theo quy định có hiệu lực.\nCăn cứ giáo dục hành vi: '+sources.conduct},
{title:'Chọn cách xử lí có trách nhiệm',part:'Kiểm tra nhanh · Chọn một đáp án',quiz:{q:'Lan định đăng ảnh chụp tin nhắn riêng của bạn để chứng minh mình đúng. Cách nào phù hợp nhất?',options:['Đăng ngay rồi xoá sau một giờ.','Che tên là có thể đăng mọi nội dung.','Trao đổi riêng; nếu cần giúp đỡ, cung cấp thông tin cần thiết cho người có trách nhiệm.','Nhờ người khác đăng hộ để mình không chịu trách nhiệm.'],answer:2,explain:'Ưu tiên giải quyết riêng và bảo vệ thông tin của người liên quan. Che tên vẫn có thể để lộ danh tính qua nội dung, ảnh đại diện hoặc ngữ cảnh.'},notes:'1 phút. Cho lớp chọn trước khi bấm. Hỏi vì sao che tên chưa đủ. Đáp án C. Có thể chọn lại để so sánh; trang không thu thập dữ liệu.'},
{title:'Nếu sản phẩm của em bị đổi tên?',part:'03 · Nghĩa vụ tôn trọng bản quyền',theme:'green',body:'<p class="statement">Em mất cả buổi vẽ một tấm poster.<br>Hôm sau, một bạn nộp nó<br><span class="accent">với tên của bạn ấy.</span></p><p class="lead">Em muốn điều gì được tôn trọng?</p>'+reveal('<p class="callout">Tên người sáng tạo, công sức làm ra tác phẩm và quyền quyết định cách tác phẩm được sử dụng.</p>','Kết nối với quyền tác giả'),notes:'1 phút. Chuyển trọng tâm sang sự công bằng với người sáng tạo. Cho học sinh nêu cảm xúc trước khi giới thiệu khái niệm.'},
{title:'Quyền tác giả bảo vệ điều gì?',part:'03 · Kiến thức cốt lõi',body:'<p class="lead"><strong>Quyền tác giả</strong> là quyền của tổ chức, cá nhân đối với tác phẩm do mình sáng tạo ra hoặc sở hữu.</p><div class="split"><div class="rule"><h3>Tác phẩm trong học tập</h3><p>Bài viết, ảnh chụp, tranh vẽ, video, bài nhạc, chương trình máy tính.</p></div><div class="rule"><h3>Trách nhiệm của người dùng</h3><p>Kiểm tra quyền sử dụng, tuân thủ điều kiện và ghi nhận người sáng tạo.</p></div></div><p class="bottom">Xem hoặc tải được một tác phẩm không đồng nghĩa với được tự do dùng lại.</p>',notes:'2 phút cho trang này và trang tiếp. Tác phẩm được bảo hộ phải đáp ứng điều kiện luật định. Không đồng nhất tác giả với chủ sở hữu.\nNguồn: Luật Sở hữu trí tuệ (văn bản hợp nhất 2026), Điều 4, 6, 14, 18–20: '+sources.copyright},
{title:'Quyền nhân thân và quyền tài sản',part:'03 · Hai nhóm quyền tác giả',body:'<div class="split"><div class="rule"><h3 class="accent">Quyền nhân thân</h3><p>Đặt tên, đứng tên; công bố hoặc cho phép công bố; bảo vệ sự toàn vẹn của tác phẩm.</p><p class="small">Ví dụ: không xoá tên người chụp ảnh rồi nhận là ảnh của mình.</p></div><div class="rule"><h3 class="accent">Quyền tài sản</h3><p>Làm tác phẩm phái sinh, sao chép, phân phối, truyền đạt tới công chúng… theo quy định.</p><p class="small">Ví dụ: muốn đưa tác phẩm vào video công khai cần kiểm tra quyền sử dụng.</p></div></div><p class="bottom">Tác giả và chủ sở hữu quyền tác giả có thể là các chủ thể khác nhau.</p>',notes:'Không dùng mẹo “nhân thân không bao giờ chuyển giao”: quyền công bố có quy định riêng; luật có quy định về chuyển quyền sử dụng quyền đặt tên.\nNguồn: Điều 19, 20, 45, 47 Luật Sở hữu trí tuệ: '+sources.copyright},
{title:'Ghi nguồn đã đủ chưa?',part:'03 · Một hiểu nhầm thường gặp',body:'<div class="split"><div><p class="statement">Ghi nguồn<br><span class="accent">chưa đồng nghĩa</span><br>được phép dùng.</p></div><div><p class="lead">Một ảnh ghi “không được đăng lại”. Em tải về, thêm tên tác giả rồi đăng lên trang lớp.</p><p class="prompt" style="margin-top:24px">Điều gì còn thiếu?</p></div></div>'+reveal('<div class="callout">Cần có quyền sử dụng phù hợp: được chủ thể quyền cho phép, được giấy phép cho phép, hoặc thuộc trường hợp ngoại lệ đáp ứng điều kiện luật định.</div>','Mở lời giải'),notes:'2 phút. Cần có quyền sử dụng và thực hiện đúng điều kiện. Không dạy rằng cứ dùng cho học tập là tự động miễn xin phép. Ngoại lệ có phạm vi và điều kiện cụ thể.\nNguồn: Điều 20, 25 Luật Sở hữu trí tuệ: '+sources.copyright},
{title:'Mua phần mềm: đọc giấy phép',part:'03 · Bản quyền phần mềm',body:'<p class="lead">Giả sử một gói phần mềm ghi rõ:<br><strong class="accent">“Giấy phép cá nhân · sử dụng trên 1 thiết bị”.</strong></p><div class="split"><div class="rule"><h3>Em được làm gì?</h3><p>Cài và dùng trong phạm vi giấy phép; tuân thủ điều khoản đi kèm.</p></div><div class="rule"><h3>Em chưa được làm gì?</h3><p>Tự ý chia sẻ mã kích hoạt cho cả lớp, bán bản sao hoặc nhận mã nguồn là của mình.</p></div></div><p class="bottom">Mua quyền sử dụng không đồng nghĩa với nhận quyền sở hữu tác phẩm.</p>',notes:'2 phút. Điều khoản giả định để luyện đọc, không phải điều khoản chung cho mọi phần mềm. Giấy phép có thể tính theo người dùng, thiết bị, thời hạn. Quyền cụ thể do hợp đồng và pháp luật quyết định.\nNguồn: Điều 47–48 Luật Sở hữu trí tuệ: '+sources.copyright},
{title:'Chọn phần mềm và tài nguyên phù hợp',part:'03 · Thực hiện tôn trọng bản quyền',body:'<div class="rows">'+row('01','Ưu tiên sản phẩm tự tạo','Tự viết, tự chụp, tự ghi âm; vẫn tôn trọng quyền của người xuất hiện trong sản phẩm.')+row('02','Tìm tài nguyên có giấy phép phù hợp','Đọc điều kiện về sao chép, chỉnh sửa, chia sẻ và mục đích sử dụng.')+row('03','Dùng phần mềm hợp pháp','Chọn giấy phép của trường, phần mềm miễn phí hợp pháp hoặc mã nguồn mở phù hợp.')+row('04','Tránh bản bẻ khoá và bản chia sẻ trái phép','Không vượt điều kiện cấp phép; bản cài không rõ nguồn còn có nguy cơ chứa mã độc.')+'</div>',notes:'1 phút. Miễn phí không đồng nghĩa không có bản quyền. Mã nguồn mở cũng có giấy phép. Không khẳng định mọi phần mềm crack đều có mã độc.\nNguồn: Điều 20, 47–48 Luật Sở hữu trí tuệ: '+sources.copyright},
{title:'Đọc nhanh giấy phép Creative Commons',part:'03 · Mở rộng để sử dụng tài nguyên',body:'<table class="table"><thead><tr><th>KÍ HIỆU</th><th>ĐIỀU KIỆN CHÍNH</th><th>KHI DÙNG, EM CẦN NHỚ</th></tr></thead><tbody><tr><td>BY</td><td>Ghi công</td><td>Ghi nhận tác giả, nguồn, giấy phép; nêu thay đổi nếu có.</td></tr><tr><td>NC</td><td>Phi thương mại</td><td>Không sử dụng cho mục đích thương mại.</td></tr><tr><td>ND</td><td>Không chia sẻ bản phái sinh</td><td>Không phân phối bản đã chỉnh sửa theo giấy phép này.</td></tr><tr><td>SA</td><td>Chia sẻ tương tự</td><td>Khi chia sẻ bản phái sinh, dùng giấy phép cùng loại hoặc tương thích.</td></tr></tbody></table><p class="bottom">Ví dụ: CC BY-SA = ghi công + chia sẻ tương tự. Luôn mở và đọc giấy phép cụ thể.</p>',notes:'2 phút. Tóm tắt điều kiện chính, không thay toàn văn. Không phải mọi tài nguyên CC đều được sửa hoặc dùng thương mại.\nNguồn: '+sources.cc+'\nVí dụ: '+sources.by},
{title:'Ghi nguồn để người khác kiểm tra được',part:'03 · Một mẫu có thể áp dụng',body:'<p class="lead">Ghi đủ thông tin, kèm đường dẫn khi có:</p><p class="statement accent" style="font-size:44px">Tên tác phẩm · Tác giả<br>Nguồn · Giấy phép · Thay đổi</p><div class="rule"><p><strong>Ví dụ minh hoạ:</strong> “Sân trường buổi sớm” — Minh An.<br>Nguồn: [liên kết ảnh gốc]. CC BY 4.0 [liên kết giấy phép].<br>Đã cắt khung và thêm chữ.</p></div><p class="bottom">Mẫu trên là dữ liệu giả định; khi làm bài, thay bằng thông tin và liên kết thật.</p>',notes:'1 phút. Đặt ghi công dưới ảnh hoặc ở trang nguồn rõ ràng theo điều kiện giấy phép. Không dùng “Nguồn: Internet/Google”. CC BY 4.0 còn yêu cầu giữ thông báo liên quan nếu được cung cấp.\nNguồn: '+sources.by},
{title:'Ảnh đẹp trên mạng: em chọn cách nào?',part:'Luyện tập · Chọn một đáp án',quiz:{q:'Nhóm cần một ảnh để đăng poster lên trang lớp. Ảnh tìm được không có thông tin giấy phép. Em chọn cách nào?',options:['Dùng luôn vì trang lớp không bán hàng.','Thêm “Nguồn: Internet” rồi sử dụng.','Xoá dấu tác giả để ảnh gọn hơn.','Tìm chủ thể quyền để xin phép hoặc chọn ảnh khác có giấy phép phù hợp.'],answer:3,explain:'Không có thông tin giấy phép thì chưa có cơ sở kết luận được dùng lại. Xin phép hoặc chọn ảnh có quyền sử dụng rõ ràng; sau đó ghi công đúng điều kiện.'},notes:'1 phút. Đáp án D. Vì sao “không bán hàng” chưa đủ? Phi thương mại chỉ là một điều kiện trong một số giấy phép, không phải quyền tự động dùng mọi ảnh.'},
{title:'Một giấy phép, cả nhóm cùng dùng?',part:'Luyện tập · Chọn một đáp án',quiz:{q:'Giấy phép giả định cho phép cài trên 1 máy. Nhóm có 5 máy và muốn dùng phần mềm đó. Cách nào phù hợp?',options:['Chia sẻ mã vì các máy chỉ dùng để học.','Kiểm tra gói của trường, mua thêm quyền phù hợp hoặc chọn phần mềm hợp pháp khác.','Cài bản bẻ khoá để không bị tính thêm máy.','Mua một lần thì được sao chép không giới hạn.'],answer:1,explain:'Phải sử dụng trong phạm vi cấp phép. Nhu cầu học tập không tự làm mất giới hạn 1 máy; nhóm có thể chọn giấy phép phù hợp hoặc công cụ hợp pháp khác.'},notes:'1 phút. Đáp án B. Khuyến khích giải pháp theo công cụ trường đang có, không giới thiệu điều khoản một hãng cụ thể nếu chưa kiểm tra.'},
{title:'Đúng hay sai? Hãy giải thích',part:'Luyện tập · Thảo luận cặp đôi',body:'<div class="rows">'+row('A','“Xoá bài thì mọi bản sao cũng biến mất.”','')+row('B','“Tác giả và chủ sở hữu luôn là một người.”','')+row('C','“Phần mềm miễn phí vẫn có điều kiện sử dụng.”','')+row('D','“Khi tranh luận, có thể phản biện ý kiến mà vẫn tôn trọng người nói.”','')+'</div>'+reveal('<div class="callout"><strong>A: Sai</strong> — có thể còn bản sao. <strong>B: Sai</strong> — có thể khác nhau.<br><strong>C: Đúng</strong> — cần đọc giấy phép. <strong>D: Đúng</strong> — góp ý vào vấn đề, tránh công kích.</div>','Đối chiếu và giải thích'),notes:'2 phút. Mỗi cặp chọn một ý sai để sửa. Đáp án cần có lí do. Đây là ôn tập trong lớp, không dùng cơ chế tính điểm thi tốt nghiệp.'},
{title:'Nhiệm vụ: poster cho ngày hội trường',part:'Vận dụng · Làm nhóm trong 3 phút',body:'<p class="lead">Nhóm chuẩn bị đăng poster, nhưng đang có ba vấn đề:</p><div class="rows">'+row('1','Ảnh bạn cùng lớp chưa được bạn đồng ý đăng.','')+row('2','Nhạc nền tải từ một kênh không ghi giấy phép.','')+row('3','Một bình luận chê ngoại hình bạn xuất hiện dưới bài nháp.','')+'</div><p class="prompt">Với mỗi vấn đề: nêu việc cần dừng + một cách thay thế.</p><div class="timer-line"><button id="timer-toggle">Bắt đầu 3 phút</button><span id="timer" role="timer" aria-label="Thời gian thảo luận">03:00</span><button id="timer-reset">Đặt lại</button></div>',notes:'3 phút. Nhóm 4 học sinh: người phân tích, người đề xuất, người ghi, người báo cáo. Không cần làm poster hoàn chỉnh. Sản phẩm là ba cặp “dừng việc gì/làm gì thay thế”. Có thể rút xuống 90 giây nếu cần.'},
{title:'Một phương án cho nhóm',part:'Vận dụng · Đối chiếu',body:'<div class="rows">'+row('1','Ảnh: xin sự đồng ý phù hợp trước khi đăng','Nếu bạn không muốn xuất hiện, đổi ảnh hoặc dùng ảnh tự tạo không lộ thông tin của bạn.')+row('2','Nhạc: xác minh quyền sử dụng','Xin phép hoặc thay bằng nhạc tự tạo/tài nguyên có giấy phép phù hợp; ghi công theo điều kiện.')+row('3','Bình luận: dừng nội dung gây tổn thương','Ẩn/gỡ hoặc báo cáo theo quyền quản trị; hỗ trợ bạn, nhờ giáo viên nếu cần.')+'</div><p class="bottom">Tự đánh giá: nhận diện đủ 3 vấn đề · có 3 hành động cụ thể · giải thích được lí do.</p>',notes:'1 phút. Chấp nhận phương án khác nếu bảo vệ người liên quan và tuân thủ quyền sử dụng. Đây là gợi ý cho tình huống giả định, không phải kết luận pháp lí về cá nhân.'},
{title:'Ba câu hỏi trước khi hành động',part:'Ghi nhớ',theme:'dark',body:'<div class="rows">'+row('01','Thông tin đã được kiểm chứng chưa?','Chưa rõ nguồn → chưa vội chia sẻ.')+row('02','Mình có đang tôn trọng người khác không?','Tôn trọng riêng tư, nói lịch sự, hỗ trợ người bị tổn thương.')+row('03','Mình có quyền sử dụng sản phẩm này không?','Kiểm tra giấy phép, xin phép khi cần, ghi nguồn đúng điều kiện.')+'</div><p class="statement accent" style="font-size:40px;margin-top:20px">Dừng một nhịp. Kiểm tra. Rồi hành động.</p>',notes:'30 giây. Đọc thầm ba câu hỏi. Liên hệ tin nhắn đầu bài: câu hỏi 2 giúp chọn phản hồi, câu hỏi 3 áp dụng khi dùng sản phẩm số.'},
{title:'Phiếu ra khỏi lớp',part:'Kết thúc · 1 phút',body:'<p class="lead">Trả lời bằng lời, viết ra giấy hoặc gõ vào ô dưới đây:</p><div class="rows">'+row('1','Một điều em sẽ kiểm tra trước khi chia sẻ tin.','')+row('2','Vì sao ghi nguồn chưa đủ để dùng mọi tác phẩm?','')+row('3','Một việc em sẽ thay đổi khi dùng mạng hoặc làm bài nhóm.','')+'</div><textarea class="write" aria-label="Câu trả lời cuối giờ" placeholder="Em chọn một câu và viết câu trả lời ngắn…"></textarea><p class="small">Ô nháp chỉ dùng trong phiên đang mở, không gửi hay lưu câu trả lời.</p>',notes:'1 phút. Có thể thu câu 2 làm minh chứng đạt mục tiêu. Câu 3 chuyển kiến thức thành thói quen, không yêu cầu tiết lộ chuyện riêng.\nBài về nhà: rà soát một sản phẩm số của nhóm, bổ sung nguồn/giấy phép hoặc thay tài nguyên chưa rõ quyền sử dụng.'},
{title:'Nguồn và tài liệu đọc thêm',part:'Tham khảo',body:'<p class="small">Nội dung bám các mạch kiến thức Bài 11, Tin học 10 — Kết nối tri thức với cuộc sống. Tình huống và ví dụ được biên soạn cho hoạt động lớp học.</p><ol class="source-list"><li><a href="'+sources.conduct+'" target="_blank" rel="noopener">Bộ Quy tắc ứng xử trên mạng xã hội — Quyết định 874/QĐ-BTTTT</a>: tôn trọng, lành mạnh, an toàn và trách nhiệm.</li><li><a href="'+sources.copyright+'" target="_blank" rel="noopener">Luật Sở hữu trí tuệ — văn bản hợp nhất năm 2026</a>: Điều 4, 19–20, 25, 45, 47–48 về quyền tác giả và sử dụng tác phẩm.</li><li><a href="'+sources.amendment+'" target="_blank" rel="noopener">Luật 131/2025/QH15 sửa đổi, bổ sung Luật Sở hữu trí tuệ</a>.</li><li><a href="'+sources.cc+'" target="_blank" rel="noopener">Creative Commons — các loại giấy phép</a> và <a href="'+sources.by+'" target="_blank" rel="noopener">điều kiện CC BY 4.0</a>.</li></ol><p class="bottom">Gợi ý dạy trên từng trang có chỉ dẫn và nguồn liên quan. Các tóm tắt không thay thế toàn văn văn bản hoặc giấy phép.</p>',notes:'Trang đọc thêm. Liên kết cần Internet; nội dung trình chiếu và tương tác hoạt động ngoại tuyến. Không dùng mức tiền phạt từ bản cũ vì cần đối chiếu chủ thể và quy định áp dụng.'}
];
const deck=document.getElementById('deck');
slides.forEach((s,i)=>{
 const section=document.createElement('section');section.className='slide '+(s.theme||'');section.id='slide-'+(i+1);section.setAttribute('aria-label',(i+1)+'. '+s.title);section.setAttribute('aria-hidden','true');section.inert=true;
 const heading=i===0?'':'<h2>'+s.title+'</h2>';let body=s.body||'';
 if(s.quiz){const q=s.quiz;body='<p class="lead">'+q.q+'</p><div class="options">'+q.options.map((o,j)=>'<button class="option" data-option="'+j+'" aria-pressed="false"><span class="letter">'+String.fromCharCode(65+j)+'</span><span>'+o+'</span></button>').join('')+'</div><div class="feedback" role="status" aria-live="polite"></div>';}
 section.innerHTML='<p class="eyebrow">'+s.part+'</p>'+heading+'<div class="content">'+body+'</div><span class="number">'+String(i+1).padStart(2,'0')+'</span>';
 if(i===0)section.querySelector('.content').style.justifyContent='flex-start';
 section.querySelectorAll('[data-reveal]').forEach(b=>b.addEventListener('click',()=>{b.nextElementSibling.classList.toggle('shown');b.setAttribute('aria-expanded',b.nextElementSibling.classList.contains('shown'));b.textContent=b.nextElementSibling.classList.contains('shown')?'Ẩn gợi ý':'Mở gợi ý';updateReveal();}));
 section.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>{const selected=Number(b.dataset.option),q=s.quiz;section.querySelectorAll('[data-option]').forEach(x=>{const j=Number(x.dataset.option);x.classList.toggle('correct',j===q.answer);x.classList.toggle('wrong',j===selected&&j!==q.answer);x.setAttribute('aria-pressed',String(j===selected));});section.querySelector('.feedback').textContent=(selected===q.answer?'Đúng. ':'Chưa phù hợp. Đáp án '+String.fromCharCode(65+q.answer)+'. ')+q.explain;}));
 deck.appendChild(section);const toc=document.createElement('button');toc.textContent=String(i+1).padStart(2,'0')+'  '+s.title;toc.addEventListener('click',()=>{go(i);document.getElementById('toc-dialog').close();});document.getElementById('toc-list').appendChild(toc);
});
const sections=Array.from(deck.children);let current=0;
function fit(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1280,document.getElementById('viewport').clientHeight/720));}
function hashIndex(){const m=location.hash.match(/^#slide-(\d+)$/);return m?Math.min(slides.length-1,Math.max(0,Number(m[1])-1)):0;}
function updateReveal(){document.getElementById('reveal').disabled=!sections[current].querySelector('.answer:not(.shown)');}
function go(i,writeHash=true){current=Math.max(0,Math.min(i,slides.length-1));sections.forEach((s,j)=>{s.classList.toggle('active',j===current);s.setAttribute('aria-hidden',String(j!==current));s.inert=j!==current;});document.getElementById('counter').textContent=(current+1)+' / '+slides.length;document.getElementById('progress').style.width=((current+1)/slides.length*100)+'%';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;Array.from(document.getElementById('toc-list').children).forEach((b,j)=>b.setAttribute('aria-current',String(j===current)));document.getElementById('notes-panel').textContent=slides[current].notes;document.getElementById('notes-title').textContent='Trang '+(current+1)+' · '+slides[current].title;updateReveal();if(writeHash)history.replaceState(null,'','#slide-'+(current+1));}
function revealNext(){const a=sections[current].querySelector('.answer:not(.shown)');if(a){a.classList.add('shown');a.previousElementSibling.setAttribute('aria-expanded','true');a.previousElementSibling.textContent='Ẩn gợi ý';updateReveal();return true;}return false;}
function openDialog(id){const d=document.getElementById(id);if(!d.open)d.showModal();}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){document.getElementById('fullscreen').textContent='Dùng F11';}}
document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('reveal').onclick=revealNext;document.getElementById('toc-open').onclick=()=>openDialog('toc-dialog');document.getElementById('notes-open').onclick=()=>openDialog('notes-dialog');document.getElementById('fullscreen').onclick=fullscreen;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}}));
document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||e.target.closest('textarea,input,select')||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();if((k===' '||k==='enter')&&e.target.closest('button,a'))return;if(['arrowright','pagedown','arrowleft','pageup',' ','arrowdown','home','end','m','n','f'].includes(k))e.preventDefault();if(k==='arrowright'||k==='pagedown')go(current+1);if(k==='arrowleft'||k==='pageup')go(current-1);if(k===' '||k==='arrowdown'){if(!revealNext())go(current+1);}if(k==='home')go(0);if(k==='end')go(slides.length-1);if(k==='m')openDialog('toc-dialog');if(k==='n')openDialog('notes-dialog');if(k==='f')fullscreen();});
let remaining=180,timerId=null,deadline=0;const timerButton=document.getElementById('timer-toggle'),timerDisplay=document.getElementById('timer');
function drawTime(){timerDisplay.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');}
function pauseTimer(){if(timerId!==null){clearInterval(timerId);timerId=null;}timerButton.textContent=remaining>0?'Tiếp tục':'Hết giờ';}
timerButton.onclick=()=>{if(timerId!==null){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));pauseTimer();drawTime();return;}if(remaining===0)return;deadline=Date.now()+remaining*1000;timerButton.textContent='Tạm dừng';timerId=setInterval(()=>{remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));drawTime();if(remaining===0)pauseTimer();},200);};
document.getElementById('timer-reset').onclick=()=>{pauseTimer();remaining=180;drawTime();timerButton.textContent='Bắt đầu 3 phút';};
window.addEventListener('resize',fit);window.addEventListener('hashchange',()=>go(hashIndex(),false));go(hashIndex(),false);fit();
</script></body></html>
